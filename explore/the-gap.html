<!DOCTYPE html><html lang="en"><head><title>The gap</title><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../assets/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="explore.css" />
<style>
.chart{position:relative;width:min(760px,92vw);flex:1;min-height:0;margin-bottom:10px}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(18px,6vw,70px);transform-origin:50% 100%}
.bar{position:relative;width:clamp(70px,16vw,150px);height:0;background:var(--blue);border-radius:14px 14px 0 0}
.bar.b20{background:#111}.bar.b80{background:var(--blue)}.bar.b5{background:#6f8fd6}
.tag{position:absolute;left:50%;bottom:100%;transform:translateX(-50%) scale(var(--inv,1));transform-origin:50% 100%;white-space:nowrap;padding-bottom:8px;text-align:center}
.tag b{display:block;font-size:clamp(22px,3.4vw,40px);font-weight:500;letter-spacing:-.04em}
.tag span{color:var(--dim)}
.base{position:absolute;left:0;right:0;bottom:0;height:1px;background:#cfcdc7}
.cap{min-height:150px}
</style></head><body>
<div class="grain" aria-hidden="true"></div><header class="top"><a class="pill" href="./"><img src="../assets/favicon.png" alt="" />Scroll ideas</a><a class="pill" href="../">Site</a></header>
<section class="stage" id="stage">
  <div class="chart" id="chart"><div class="bars" id="bars">
    <div class="bar b20" id="b20"><div class="tag" id="t20"><b>$0</b><span class="mono">Bottom fifth</span></div></div>
    <div class="bar b80" id="b80"><div class="tag" id="t80"><b>$0</b><span class="mono">Top fifth</span></div></div>
    <div class="bar b5" id="b5"><div class="tag" id="t5"><b>$0</b><span class="mono">Top 5%, average</span></div></div>
  </div><div class="base"></div></div>
  <div class="cap" id="cap"><p class="mono kicker" id="kicker"></p><p class="big" id="big"></p><p class="line" id="line"></p><p class="mono src" id="src"></p></div>
  <div class="steps" id="steps" aria-hidden="true"></div>
</section>
<section class="outro"><div><p>Same country. Same year. Sixteen times apart.</p><a href="./">More ways to tell it ↗</a></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script><script src="explore.js"></script><script src="the-gap.js"></script></body></html>
