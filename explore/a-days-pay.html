<!DOCTYPE html><html lang="en"><head><title>A day's pay</title><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../assets/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="explore.css" />
<style>
.clock{font-size:clamp(14px,1.6vw,20px);color:var(--dim);margin-bottom:18px}
.rows{width:min(900px,92vw);display:grid;gap:22px;margin-bottom:26px;text-align:left}
.row .lab{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.row .lab b{font-size:clamp(20px,2.6vw,32px);font-weight:500;letter-spacing:-.04em}
.track{height:clamp(26px,5vh,44px);background:#e4e2dc;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;background:var(--blue)}
.fill.min{background:#111}
.mark{position:absolute}
.cap{min-height:150px}
</style></head><body>
<div class="grain" aria-hidden="true"></div><header class="top"><a class="pill" href="./"><img src="../assets/favicon.png" alt="" />Scroll ideas</a><a class="pill" href="../">Site</a></header>
<section class="stage" id="stage">
  <p class="mono clock" id="clock">9:00 am</p>
  <div class="rows">
    <div class="row"><div class="lab"><span class="mono">Minimum wage, $7.25 an hour</span><b id="vMin">$0.00</b></div><div class="track"><div class="fill min" id="fMin"></div></div></div>
    <div class="row"><div class="lab"><span class="mono">Top 5% household, average</span><b id="vTop">$0.00</b></div><div class="track"><div class="fill" id="fTop"></div></div></div>
  </div>
  <div class="cap" id="cap"><p class="mono kicker" id="kicker"></p><p class="big" id="big"></p><p class="line" id="line"></p><p class="mono src" id="src"></p></div><div class="steps" id="steps" aria-hidden="true"></div>
</section>
<section class="outro"><div><p>Same hours. Not the same day.</p><a href="./">More ways to tell it ↗</a></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script><script src="explore.js"></script><script src="a-days-pay.js"></script></body></html>
