<!DOCTYPE html><html lang="en"><head><title>40.8 million</title><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../assets/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="explore.css" />
<style>
.field{display:grid;grid-template-columns:repeat(24,1fr);gap:clamp(3px,.6vw,7px);width:min(920px,92vw,calc((100svh - 380px) * 24 / 17));margin-bottom:18px}
.field i{aspect-ratio:1;border-radius:50%;background:#d9d7d1;transition:background .25s,transform .25s}
.field i.on{background:var(--blue);transform:scale(1.08)}
.snd{position:fixed;right:var(--gutter);bottom:74px;z-index:45;height:36px;padding:0 14px;border:1px solid rgba(17,17,17,.2);border-radius:999px;background:rgba(255,255,255,.7);font:500 12px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.snd[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.cap{min-height:170px}
</style></head><body>
<div class="grain" aria-hidden="true"></div><header class="top"><a class="pill" href="./"><img src="../assets/favicon.png" alt="" />Scroll ideas</a><a class="pill" href="../">Site</a></header>
<section class="stage" id="stage">
  <div class="field" id="field" role="img" aria-label="408 dots, each representing 100,000 people living in poverty"></div>
  <div class="cap" id="cap"><p class="mono kicker" id="kicker"></p><p class="big" id="big"></p><p class="line" id="line"></p><p class="mono src" id="src"></p></div><div class="steps" id="steps" aria-hidden="true"></div>
</section>
<button class="snd" id="snd" type="button" aria-pressed="false">Sound off</button>
<section class="outro"><div><p>One in eight of us.</p><a href="./">More ways to tell it ↗</a></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script><script src="explore.js"></script><script src="poverty-dots.js"></script></body></html>
