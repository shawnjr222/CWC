<!DOCTYPE html>

<head>

  <style>
    :root { --bg: #f1f0ec; --ink: #111; --dim: #6a6965; --blue: #1250c4; --gutter: clamp(16px, 3vw, 36px); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); color: var(--ink); font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--blue); color: #fff; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    header { padding: 14px var(--gutter); }
    .brand { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px 0 14px; border-radius: 999px; background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
    .brand img { width: 20px; height: 20px; }
    main { display: grid; place-content: center; justify-items: center; gap: 22px; padding: 40px var(--gutter) 72px; text-align: center; }
    .sun { width: clamp(96px, 16vw, 150px); height: auto; }
    .code { font: 400 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
    h1 { font-size: clamp(34px, 6vw, 72px); font-weight: 500; line-height: 1.02; letter-spacing: -.04em; max-width: 14em; text-wrap: balance; }
    h1 em { font-style: normal; color: var(--blue); }
    p { color: var(--dim); font-size: clamp(16px, 1.6vw, 20px); max-width: 30em; letter-spacing: -.01em; line-height: 1.4; }
    .home { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 17px; font-weight: 500; letter-spacing: -.01em; border-bottom: 1px solid currentColor; padding-bottom: 2px; transition: color .25s ease; }
    .home:hover { color: var(--blue); }
    footer { padding: 22px var(--gutter); color: var(--dim); border-top: 1px solid #dcdad4; font: 400 12px/1.4 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; }
  </style>
</head>

</body>
